<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Referenzeditor | ICT</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
@font-face{font-family:Montserrat;font-weight:300;src:local("Montserrat Light"),url("fonts/Montserrat-Light.ttf")}
@font-face{font-family:Montserrat;font-weight:400;src:local("Montserrat Regular"),url("fonts/Montserrat-Regular.ttf")}
@font-face{font-family:Montserrat;font-weight:600;src:local("Montserrat SemiBold"),url("fonts/Montserrat-SemiBold.ttf")}
@font-face{font-family:Montserrat;font-weight:700;src:local("Montserrat Bold"),url("fonts/Montserrat-Bold.ttf")}
:root{--blue:#4D49BC;--violet:#3E0D81;--l1:#8977F3;--l2:#BBB1F8;--l3:#DDD8FB;--g1:#534B5E;--g2:#625F73;--g3:#827E8E;--g4:#B9B7C5;--g5:#D3D2DC;--g6:#F0EEF4;--salmon:#FF997F}
*{box-sizing:border-box}
html,body{margin:0;height:100%;font-family:Montserrat,Arial,sans-serif;color:#000;background:var(--g6)}
#app{display:grid;grid-template-columns:minmax(380px,520px) 1fr;grid-template-rows:auto 1fr;height:100vh}
header.bar{grid-column:1/3;display:flex;gap:8px;align-items:center;padding:10px 16px;background:var(--violet);color:#fff;flex-wrap:wrap}
header.bar h1{font-size:15px;margin:0 12px 0 0;font-weight:700}
header.bar .sp{flex:1}
button,.btn{font:600 12px Montserrat,Arial,sans-serif;border:0;border-radius:6px;padding:8px 12px;cursor:pointer;background:var(--l3);color:var(--violet)}
button:hover,.btn:hover{background:var(--l2)}
button.ic{display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;padding:0;background:rgba(255,255,255,.14);color:#fff}
button.ic:hover{background:rgba(255,255,255,.3)}
button.pri{background:var(--blue);color:#fff}button.pri:hover{background:var(--l1)}
button.sm{padding:4px 8px;font-size:11px}
button.del{background:var(--g6);color:var(--g1)}
#form{overflow:auto;padding:12px 14px 60px;background:#fff;border-right:1px solid var(--g5)}
#pv{overflow:auto;padding:16px;background:var(--g5)}
details{border:1px solid var(--g5);border-radius:8px;margin:0 0 10px;background:#fff}
summary{cursor:pointer;padding:10px 12px;font-weight:700;font-size:13px;color:var(--violet);list-style:none;display:flex;justify-content:space-between;align-items:center}
summary::-webkit-details-marker{display:none}
summary .ttl{display:flex;align-items:center;gap:9px}
summary .rt{display:flex;align-items:center;gap:10px}
.dot{flex:none;width:12px;height:12px;border-radius:50%;border:2px solid var(--g4);background:transparent;display:inline-block;transition:all .2s}
.dot.done{background:#2e9e5b;border-color:#2e9e5b}
.arr{flex:none;width:8px;height:8px;border-right:2px solid var(--violet);border-bottom:2px solid var(--violet);transform:rotate(45deg) translate(-2px,-2px);transition:transform .2s;margin-right:3px}
details[open]>summary .arr{transform:rotate(-135deg) translate(-2px,-2px)}
summary .cnt{font-weight:600;font-size:10px;background:var(--salmon);color:#000;border-radius:10px;padding:2px 8px}
summary .cnt.ok{background:var(--l3);color:var(--violet)}
.sec{padding:4px 12px 12px;display:grid;gap:10px}
label.f{display:grid;gap:3px;font-size:11px;font-weight:600;color:var(--g2)}
label.f .h{font-weight:400;color:var(--g3);font-size:10px}
input[type=text],input[type=url],textarea,select{width:100%;font:400 12px Montserrat,Arial,sans-serif;padding:7px 8px;border:1px solid var(--g4);border-radius:6px;background:#fff;color:#000}
textarea{resize:vertical;min-height:56px}
input:focus,textarea:focus,select:focus{outline:2px solid var(--l2);border-color:var(--blue)}
.row{display:grid;gap:8px}.r2{grid-template-columns:1fr 1fr}.r3{grid-template-columns:1fr 1fr 1fr}
.tile{border:1px solid var(--g5);border-radius:6px;padding:8px;display:grid;gap:6px;background:var(--g6)}
.cc{font-size:10px;color:var(--g3);text-align:right}.cc.over{color:#c0392b;font-weight:700}
.imgslot{border:2px dashed var(--g4);border-radius:8px;padding:10px;text-align:center;background:var(--g6);font-size:11px;color:var(--g2)}
.imgslot.drag{border-color:var(--blue);background:var(--l3)}
.imgslot img{max-width:100%;max-height:120px;display:block;margin:0 auto 6px;border-radius:4px}
.lnk{display:grid;grid-template-columns:1fr 1fr auto auto;gap:6px;align-items:center}
.note{font-size:11px;color:var(--g2);background:var(--l3);border-radius:6px;padding:8px 10px}
.sheetwrap{display:flex;gap:16px;flex-wrap:wrap;justify-content:center;align-items:flex-start}
.zoomctl{position:sticky;top:0;z-index:5;display:flex;gap:8px;align-items:center;justify-content:center;margin-bottom:10px;font-size:11px}
.page{position:relative;width:21cm;height:29.7cm;background:#fff;overflow:hidden;box-shadow:0 2px 12px rgba(0,0,0,.25);font-family:Montserrat,Arial,sans-serif;flex:none}
.page *{position:absolute;margin:0;line-height:1.3}
.page .t{white-space:pre-wrap;overflow:hidden}
.page .hk{cursor:pointer}
.page .addrow{cursor:pointer;color:var(--blue);font-weight:700;font-size:8pt;display:flex;align-items:center;padding-left:.2cm;border:1px dashed var(--l2);border-radius:3px;box-sizing:border-box}.page .addrow:hover{background:rgba(137,119,243,.15)}
.page .td.rh{outline:2px dashed var(--blue);outline-offset:-1px;background:rgba(137,119,243,.15)}
.page .hk:hover{outline:2px dashed var(--blue);outline-offset:2px;background:rgba(137,119,243,.15)}
.page .th.hk:hover{background:var(--blue)}
.page .ph{color:var(--g4)!important}
.page .ovf{outline:2px solid #e74c3c;outline-offset:1px}
.k{font-size:7pt;font-weight:700;color:var(--blue);letter-spacing:.06em}
.h1{font-size:22pt;font-weight:700}
.h2{font-size:13pt;font-weight:300;color:var(--g1)}
.cap{font-size:5.5pt;color:var(--g3)}
.tl{background:var(--g6)}
.tll{font-size:6pt;font-weight:700;color:var(--g2)}
.tlv{font-size:8.5pt;font-weight:700;color:var(--blue)}
.hd{font-size:9.5pt;font-weight:700}
.bd{font-size:7.8pt;font-weight:300}
.bul{font-size:7.8pt;font-weight:300}
.ft{font-size:6pt;color:var(--g3)}
.th{background:var(--violet);color:#fff;font-size:7pt;font-weight:700}
.td{font-size:7pt;font-weight:300;border-bottom:1px solid var(--g5)}
.ph1{font-size:7.5pt;font-weight:700}.ph2{font-size:6.5pt;font-weight:700;color:var(--l1)}.ph3{font-size:6.8pt;font-weight:300}
.pi{background:var(--g6)}
.imgbox{background:var(--g6);overflow:hidden}
.imgbox img{position:absolute;left:0;top:0;width:100%;height:100%;object-fit:cover}
#busy{position:fixed;inset:0;z-index:9999;background:rgba(62,13,129,.55);display:none;align-items:center;justify-content:center;flex-direction:column;gap:22px;color:#fff;font-family:Montserrat,Arial,sans-serif;backdrop-filter:blur(2px)}
#busy.on{display:flex}
#busy .ring{position:relative;width:220px;height:220px}
#busy svg{width:220px;height:220px;transform:rotate(-90deg)}
#busy .bg{fill:none;stroke:rgba(255,255,255,.22);stroke-width:14}
#busy .fg{fill:none;stroke:#fff;stroke-width:14;stroke-linecap:round;stroke-dasharray:565.49;stroke-dashoffset:565.49;transition:stroke-dashoffset .4s ease}
#busy .pct{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:44px;font-weight:700}
#busy .ttl{font-size:20px;font-weight:700}
#busy .sub{font-size:14px;font-weight:300;max-width:420px;text-align:center;min-height:2.6em}
dialog{border:0;border-radius:10px;padding:0;width:min(720px,92vw);box-shadow:0 8px 40px rgba(0,0,0,.4)}
dialog::backdrop{background:rgba(62,13,129,.45)}
#wiz{width:min(680px,94vw)}
#cal{width:min(400px,94vw)}.cal-h{display:flex;align-items:center;justify-content:space-between;font-weight:700;font-size:14px;color:var(--violet)}.cal-h button{width:32px;padding:6px 0}
.cal-g{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center}.cal-g .wk{font-size:10px;font-weight:700;color:var(--g3);padding:4px 0}
.cal-g button.d{background:none;color:#000;font-weight:400;padding:9px 0;border-radius:50%}.cal-g button.d:hover{background:var(--l3)}
.cal-g button.d.in{background:var(--l3);border-radius:0}.cal-g button.d.s,.cal-g button.d.e{background:var(--blue);color:#fff;font-weight:700;border-radius:50%}.cal-g button.d.t{outline:1px solid var(--g4)}
.cal-m{display:flex;gap:6px}.cal-m button{flex:1;background:var(--g6)}.cal-m button.on{background:var(--blue);color:#fff}
.cal-at{display:flex;align-items:center;justify-content:center;gap:10px;padding:22px 0}.cal-at input{width:110px;font-size:34px;font-weight:700;text-align:center;padding:8px}.cal-at span{font-size:22px;font-weight:700;color:var(--violet)}
.defb{background:var(--g6);border-left:3px solid var(--l1);border-radius:6px;padding:10px 12px;color:var(--g1);font-size:12px;line-height:1.5}.defb b{display:block;font-size:10px;letter-spacing:.04em;text-transform:uppercase;color:var(--g2);margin-bottom:4px}.defb div{white-space:pre-wrap}
.cal-r{background:var(--g6);border-radius:6px;padding:8px 10px;font-weight:600;min-height:1.4em}
.dt{position:relative}.dt input{cursor:pointer;padding-right:30px}.dt:after{content:"";position:absolute;right:9px;bottom:9px;width:14px;height:14px;pointer-events:none;background:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%234D49BC' stroke-width='2'><rect x='3' y='5' width='18' height='16' rx='2'/><path d='M3 10h18M8 3v4M16 3v4'/></svg>") center/contain no-repeat}
#ask{width:min(520px,94vw)}#ask input{font-size:14px;padding:10px 12px}#ask .hint{color:var(--g2);font-size:11px;line-height:1.5}
.wzh{display:flex;justify-content:space-between;align-items:center;font-size:11px;font-weight:700;color:var(--g2)}
.wds{display:flex;gap:6px}.wd{width:10px;height:10px;border-radius:50%;border:2px solid var(--g4);display:inline-block}.wd.cur{border-color:var(--blue);background:var(--l3)}.wd.ok{background:#2e9e5b;border-color:#2e9e5b}
.wzf{display:grid;gap:12px;max-height:52vh;overflow:auto;padding:2px}
.wzok{background:#e6f5ec;color:#1f6b3d;border-radius:6px;padding:12px;font-weight:600}
.wzb{display:flex;gap:8px;align-items:center;border-top:1px solid var(--g5);padding-top:12px}.wzb .sp{flex:1}
.wzb button:disabled{opacity:.4;cursor:default}
dialog .in{padding:18px 20px;display:grid;gap:12px;font-size:12px}
dialog h3{margin:0;color:var(--violet);font-size:15px}
dialog textarea{min-height:200px;font-family:ui-monospace,Menlo,monospace;font-size:11px}
ul.op{margin:0;padding-left:18px;font-size:12px;max-height:50vh;overflow:auto}ul.op li{margin:3px 0}
@media print{
 *{-webkit-print-color-adjust:exact!important;print-color-adjust:exact!important}
 .page .ph,.page .imgbox .ph{visibility:hidden}
 .page .imgbox:not(:has(img)){border:0!important;background:none}
 .page .ovf{outline:0}
 .page:last-child{page-break-after:auto}
 .page .addrow{display:none}
 .page .td.rh{outline:0;background:none}
 .page .hk:hover{outline:0;background:none}
 html,body{background:#fff;height:auto}
 #app{display:block;height:auto}header.bar,#form,.zoomctl{display:none!important}
 #pv{padding:0;overflow:visible;background:#fff}
 .sheetwrap{display:block}
 .page{box-shadow:none;page-break-after:always;zoom:1!important}
 @page{size:A4;margin:0}
}
</style>
</head>
<body>
<div id="app">
<header class="bar">
 <h1>Referenzblatt-Editor | ICT</h1>
 <button id="bNeu" class="ic" title="Neues leeres Blatt" aria-label="Neues leeres Blatt"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/><path d="M12 11v6M9 14h6"/></svg></button>
 <button id="bBsp" class="ic" title="Beispiel laden (ARBURG)" aria-label="Beispiel laden (ARBURG)"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6M10 21h4"/><path d="M12 3a6 6 0 0 0-4 10.5c.8.8 1 1.5 1 2.5h6c0-1 .2-1.7 1-2.5A6 6 0 0 0 12 3z"/></svg></button>
 <button id="bLoad" class="ic" title="Aus Datenbank öffnen" aria-label="Aus Datenbank öffnen"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg></button>
 <button id="bSave" class="ic" title="In Datenbank speichern" aria-label="In Datenbank speichern"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 3h11l4 4v12a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2z"/><path d="M7 3v5h8V3"/><rect x="7" y="13" width="10" height="7"/></svg></button>
 <span class="sp"></span>
 <span id="saveState" style="font-size:11px;font-weight:600"></span>
 <button id="bUeb">Überschriften zurücksetzen</button>
 <button id="bCheck">Schritt für Schritt prüfen</button>
 <button id="bPpt" title="Referenzblatt als PowerPoint-Datei (Vorlage LOS04) erstellen">PPT erstellen</button>
 <button id="bPdf">PDF erstellen / drucken</button>
 <div id="accountWidget" style="display:none"></div>
 <input type="file" id="fImg" accept="image/*" hidden>
</header>
<div id="form"></div>
<div id="pv">
 <div class="zoomctl"><button class="sm" id="zm">–</button><span id="zv"></span><button class="sm" id="zp">+</button><button class="sm" id="zf">Einpassen</button><span id="ovinfo"></span><span style="color:var(--blue);font-weight:600">Tipp: Überschriften in der Vorschau anklicken zum Umbenennen</span></div>
 <div class="sheetwrap" id="sheets"></div>
</div>
</div>

<div id="busy" role="alertdialog" aria-live="polite" aria-label="KI-Analyse läuft"><div class="ring"><svg viewBox="0 0 200 200"><circle class="bg" cx="100" cy="100" r="90"></circle><circle class="fg" id="busyFg" cx="100" cy="100" r="90"></circle></svg><div class="pct" id="busyPct">0 %</div></div><div class="ttl">KI analysiert die Quellen</div><div class="sub" id="busySub"></div></div>
<dialog id="ask"><form method="dialog" class="in" id="askf"></form></dialog>
<dialog id="cal"><form method="dialog" class="in" id="calf"></form></dialog>
<dialog id="wiz"><div class="in" id="wizin"></div></dialog>
<dialog id="dlg"><div class="in" id="dlgin"></div></dialog>

<script src="vendor/supabase.js"></script>
<script src="config.js"></script>
<script src="vendor/jszip.min.js"></script>
<script src="pptx-export.js"></script>
<script src="cloud.js"></script>

function isOpen(v){return !String(v||"").trim()||/\[/.test(v)}
const SECFIELDS={
 kopf:()=>[D.nr,D.art,D.kunde,D.veranstaltung],
 kacheln:()=>D.tiles.map(t=>t.v),
 projekt:()=>[D.projekt,D.leistungen,...D.bezug],
 bilder:()=>[D.img.bild1?"x":"",D.img.bild2?"x":""],
  seite2:()=>[D.ausgang,...D.tech.slice(0,3).flatMap(t=>[t.k,t.u,t.e])],
 ablauf:()=>D.phasen.flatMap(p=>[p.z,p.x]),
 hl:()=>[D.herausf,D.loesung],

};
function setDot(k,done){const d=document.querySelector(`[data-dot="${k}"]`);if(d){d.classList.toggle("done",!!done);d.title=done?"Abgeschlossen":"Noch nicht abgeschlossen"}}
function updateCounts(){
 for(const k in SECFIELDS){
  const el=document.querySelector(`[data-cnt="${k}"]`);if(!el)continue;
  if(k==="quellen"){const q=D.links.filter(l=>l.u).length+(D.quelltext.trim()?1:0);el.textContent=q?`${q} Quelle(n)`:"keine Quelle";el.className="cnt"+(q?" ok":"");setDot(k,q>0);continue}
  const n=SECFIELDS[k]().filter(isOpen).length;
  el.textContent=n?`${n} offen`:"vollständig";el.className="cnt"+(n?"":" ok");setDot(k,n===0);
 }
 for(const k in LIM){
  const e=document.querySelector(`[data-cc="${k}"]`);if(!e)continue;
  const n=(D[k]||"").length;e.textContent=`${n} / ${LIM[k]} Zeichen`;e.classList.toggle("over",n>LIM[k]);
 }
 const c=$("#ccl");if(c){const ls=D.leistungen.split("\n").filter(x=>x.trim());c.textContent=`${ls.length} / 4 Zeilen`;c.classList.toggle("over",ls.length>4)}
}

function HH(k){const d=H_DEF.find(x=>x[0]===k)[1];return (D.h&&String(D.h[k]||"").trim())||d}
function T(cls,x,y,w,h,txt,ph,extra="",edit="",cv=""){
 const empty=!String(txt||"").trim();
 const show=empty?ph:txt;
 const ed=edit?` data-edit="${edit}" title="Klicken zum Umbenennen"`:cv?` data-cv="${cv}" title="Klicken zum Bearbeiten"`:"";
 return `<div class="t ${cls}${empty?" ph":""}${edit||cv?" hk":""}"${ed} style="left:${x}cm;top:${y}cm;width:${w}cm;height:${h}cm;${extra}">${esc(show)}</div>`;
}
function R(x,y,w,h,bg,extra=""){return `<div style="left:${x}cm;top:${y}cm;width:${w}cm;height:${h}cm;background:${bg};${extra}"></div>`}
function head(p){
 const art=(D.art&&D.art!=="__x")?D.art:"";
 const k=`REFERENZ ${D.nr||"[NR.]"}  |  ${art||"[VERANSTALTUNGSART]"}`;
 return T("k",1.5,1.3,12,.4,k,"")+`<img src="${LOGO}" style="left:15.7cm;top:.9cm;width:3.8cm;height:1.6cm;object-fit:contain;object-position:right center">`;
}
function foot(n){return R(1.5,28.3,18,.02,"#D3D2DC")+T("ft",1.5,28.5,15,.4,D.footer,"","","footer")+T("ft",16.5,28.5,3,.4,`Seite ${n} | 2`,"","text-align:right")}
function imgb(im,x,y,w,h,txt,key){const ck=key?` hk" data-img="${key}" data-drop="${key}" title="Klicken zum Bearbeiten`:"";
 if(!im)return `<div class="imgbox${ck}" style="left:${x}cm;top:${y}cm;width:${w}cm;height:${h}cm;border:1px dashed #B9B7C5"><div class="ph" style="left:0;right:0;top:50%;text-align:center;font-size:7pt;color:#B9B7C5">${esc(txt)}</div></div>`;
 const m=im.modus||"fuellen",ar=(im.w||1)/(im.h||1);let bw=w,bh=h;
 if(m==="original"){bw=Math.min(w,(im.ow||im.w||1)/37.795);bh=Math.min(h,(im.oh||im.h||1)/37.795)}
 else if(m==="vertikal")bw=Math.min(w,h*ar);
 else if(m==="horizontal")bh=Math.min(h,w/ar);
 const bx=x+(w-bw)/2,by=y+(h-bh)/2;
 return `<div class="imgbox${ck}" style="left:${bx}cm;top:${by}cm;width:${bw}cm;height:${bh}cm;background:none"><img src="${im.data}" style="${imgStyle(im)}"></div>`;
}

let zoom=null;
function renderPreview(){
 $("#sheets").innerHTML=`<div class="page" id="p1">${page1()}</div><div class="page" id="p2">${page2()}</div>`;
 applyZoom();
 let n=0;
 document.querySelectorAll("#sheets [data-ov]").forEach(e=>{if(e.scrollHeight>e.clientHeight+1){e.classList.add("ovf");n++}});
 $("#ovinfo").innerHTML=n?`<span style="color:#c0392b;font-weight:700">${n} Textfeld(er) zu lang (rot markiert)</span>`:`<span style="color:var(--g3)">Alle Texte passen</span>`;
}
function fitZoom(){const w=$("#pv").clientWidth-32;const two=$("#pv").clientWidth>2*21*37.8*.55+60;const base=21*37.795;return Math.max(.35,Math.min(1.1,two?(w-16)/2/base:w/base))}

function shrink(file){return new Promise((res,rej)=>{
 const fr=new FileReader();fr.onerror=rej;fr.onload=()=>{const im=new Image();im.onerror=rej;im.onload=()=>{
  const m=1800,s=Math.min(1,m/Math.max(im.width,im.height));const c=document.createElement("canvas");c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);
  const x=c.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,c.width,c.height);x.drawImage(im,0,0,c.width,c.height);
  res({data:c.toDataURL("image/jpeg",.85),name:file.name,modus:"fuellen",ow:im.width,oh:im.height,w:c.width,h:c.height})};im.src=fr.result};fr.readAsDataURL(file)})}

function applyResult(r,over){
 let n=0;const str=v=>typeof v==="string"?v.trim():"";
 const put=(get,set,val)=>{val=str(val);if(!val)return;const cur=get();if(over||!str(cur)||/\[/.test(cur)){if(cur!==val){set(val);n++}}};
 if(ART_OPT.includes(r.art))put(()=>D.art,v=>D.art=v,r.art);
 put(()=>D.kunde,v=>D.kunde=v,r.kunde);put(()=>D.veranstaltung,v=>D.veranstaltung=v,r.veranstaltung);
 (r.tiles||[]).slice(0,8).forEach((v,i)=>put(()=>D.tiles[i].v,x=>D.tiles[i].v=x,v));
 put(()=>D.projekt,v=>D.projekt=v,r.projekt);
 if(Array.isArray(r.leistungen))put(()=>D.leistungen,v=>D.leistungen=v,r.leistungen.map(str).filter(Boolean).slice(0,4).join("\n"));
 (r.bezug||[]).slice(0,4).forEach((v,i)=>put(()=>D.bezug[i],x=>D.bezug[i]=x,v));
 put(()=>D.ausgang,v=>D.ausgang=v,r.ausgang);
 if(Array.isArray(r.tech)){
  const rows=r.tech.map(t=>({k:str(t.k),u:str(t.u),e:str(t.e)})).filter(t=>t.k||t.u||t.e).slice(0,5);
  const empty=!D.tech.some(t=>t.k||t.u||t.e);
  if(rows.length&&(over||empty)){while(rows.length<5)rows.push({k:"",u:"",e:""});D.tech=rows;n++}
 }
 (r.phasen||[]).slice(0,4).forEach((p,i)=>{put(()=>D.phasen[i].z,x=>D.phasen[i].z=x,p&&p.z);put(()=>D.phasen[i].x,x=>D.phasen[i].x=x,p&&p.x)});
 put(()=>D.herausf,v=>D.herausf=v,r.herausf);put(()=>D.loesung,v=>D.loesung=v,r.loesung);
 (r.partner||[]).slice(0,4).forEach((v,i)=>put(()=>D.partner[i].f,x=>D.partner[i].f=x,v));
 if(r.ap)["firma","name","funktion","kontakt"].forEach(k=>put(()=>D.ap[k],x=>D.ap[k]=x,r.ap[k]));
 return n;
}

  if(o(D.ausgang))h+=fld("ausgang","Ausgangssituation und Anforderungen",{area:1,rows:5,lim:LIM.ausgang,h:"Zielgruppe, Zeitplan, Kritikalität, Schnittstellen"});
  D.tech.slice(0,3).forEach((t,i)=>{if(o(t.k)||o(t.u)||o(t.e))h+=`<div class="tile"><div style="font-size:11px;font-weight:700;color:var(--violet)">Technikzeile ${i+1}</div><div class="row r3">${fld(`tech.${i}.k`,"Komponente / System")}${fld(`tech.${i}.u`,"Umfang")}${fld(`tech.${i}.e`,"Einsatz / Bemerkung")}</div></div>`});
 }
 if(id==="ablauf")D.phasen.forEach((p,i)=>{if(o(p.z)||o(p.x))h+=`<div class="tile"><div style="font-size:11px;font-weight:700;color:var(--violet)">${esc(p.t)}</div><div class="row r2">${fld(`phasen.${i}.z`,"Zeitraum",{ph:"z. B. 3 AT oder Datum",date:1})}${fld(`phasen.${i}.x`,"Inhalt",{ph:PH_DEF[i][1]})}</div></div>`});
 if(id==="hl"){
  if(o(D.herausf))h+=fld("herausf","Herausforderung",{area:1,rows:5,lim:LIM.herausf});
  if(o(D.loesung))h+=fld("loesung","Lösung der ICT",{area:1,rows:5,lim:LIM.loesung});
 }
 if(id==="partner"){
  D.partner.forEach((p,i)=>{if(o(p.f))h+=fld(`partner.${i}.f`,p.l,{ph:"Firma, Sitz"})});
  [["firma","Ansprechpartner: Unternehmen"],["name","Ansprechpartner: Name"],["funktion","Ansprechpartner: Funktion"],["kontakt","Ansprechpartner: Telefon / E-Mail"]].forEach(([k,l])=>{if(o(D.ap[k]))h+=fld("ap."+k,l)});
 }
 return h;
}
function wizStart(){
 WZ.ids=WIZ_ORDER.filter(id=>WIZ_BLOCKS[id].open());WZ.i=0;WZ.on=true;
 if(!WZ.ids.length){dlgW(`<h3>Alles vollständig</h3><div>In keinem Block sind Punkte offen.</div><div style="text-align:right"><button class="pri" data-wz="close">Schließen</button></div>`);return}
 wizRender();
}
function dlgW(html){const d=document.getElementById("wiz");document.getElementById("wizin").innerHTML=html;if(!d.open)d.showModal()}
function wizRender(){
 if(!WZ.on)return;
 if(WZ.i>=WZ.ids.length)return wizEnd();
 const id=WZ.ids[WZ.i],b=WIZ_BLOCKS[id],N=WZ.ids.length;
 const fields=wizFields(id),done=!b.open();
 const dots=WZ.ids.map((x,k)=>`<i class="wd${k===WZ.i?" cur":""}${!WIZ_BLOCKS[x].open()?" ok":""}"></i>`).join("");
 const last=WZ.i===N-1;
 dlgW(`<div class="wzh"><span>Schritt ${WZ.i+1} von ${N}</span><span class="wds">${dots}</span></div>
 <h3>${esc(b.n)}  ${esc(b.t)}</h3><div class="note">${esc(b.w)}</div>
 ${done?`<div class="wzok">Dieser Block ist vollständig.</div>`:`<div class="wzf">${fields}</div>`}
 <div class="wzb"><button data-wz="close" class="del">Beenden</button><span class="sp"></span><button data-wz="back"${WZ.i?"":" disabled"}>Zurück</button><button data-wz="skip">Überspringen</button><button class="pri" data-wz="next">${last?"Fertig":"Weiter"}</button></div>`);
 const f=document.querySelector("#wizin .wzf input,#wizin .wzf textarea,#wizin .wzf select");if(f&&f.type!=="file")f.focus({preventScroll:true});
 updateCounts();
}
function wizEnd(){
 const rest=WZ.ids.map((id,i)=>({id,i})).filter(x=>WIZ_BLOCKS[x.id].open());
 if(!rest.length){dlgW(`<h3>Alle Blöcke abgeschlossen</h3><div class="wzok">Das Referenzblatt ist vollständig ausgefüllt. Prüfen Sie die Vorschau und erstellen Sie das PDF.</div><div class="wzb"><span class="sp"></span><button class="pri" data-wz="close">Schließen</button></div>`);return}
 dlgW(`<h3>Durchlauf beendet</h3><div>${rest.length} ${rest.length===1?"Block ist":"Blöcke sind"} noch nicht vollständig. Springen Sie bei Bedarf zurück:</div>
 <div style="display:grid;gap:6px">${rest.map(x=>`<button data-wz="goto" data-i="${x.i}" style="text-align:left">${esc(WIZ_BLOCKS[x.id].n)}  ${esc(WIZ_BLOCKS[x.id].t)}</button>`).join("")}</div>
 <div class="wzb"><span class="sp"></span><button class="pri" data-wz="close">Schließen</button></div>`);
}
document.addEventListener("click",e=>{
 const b=e.target.closest("[data-wz]");if(!b)return;
 const a=b.dataset.wz;
 if(a==="close"){WZ.on=false;document.getElementById("wiz").close()}
 else if(a==="next"||a==="skip"){WZ.i++;wizRender()}
 else if(a==="back"){WZ.i=Math.max(0,WZ.i-1);wizRender()}
 else if(a==="goto"){WZ.i=+b.dataset.i;wizRender()}
 else if(a==="analyse"){WZ.on=false;document.getElementById("wiz").close();runAnalysis()}
});
document.getElementById("wiz").addEventListener("close",()=>{WZ.on=false});
(function init(){
 try{const s=localStorage.getItem("ict_ref_editor");if(s){const p=JSON.parse(s);if(p&&p.tiles){D=Object.assign(blank(),p);D.h=Object.assign(blank().h,p.h);D.img=Object.assign({bild1:null,bild2:null,extra:[]},p.img)}}}catch(e){}
 renderForm();renderPreview();
 Cloud.ready.then(active=>{if(active)checkServer()});
})();
</script>
